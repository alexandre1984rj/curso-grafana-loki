name: Verificar curso e laboratório
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  course:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Navegador e acessibilidade
        run: |
          npm run preview > /tmp/loki-course-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: artifacts/
  lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker compose -f labs/local/compose.yaml config --quiet
      - run: docker compose -f labs/local/compose.yaml up -d
      - run: node labs/local/verify.mjs
      - run: node labs/local/verify-restart.mjs
      - name: Logs do laboratório
        if: always()
        run: docker compose -f labs/local/compose.yaml logs --no-color > lab-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-logs
          path: lab-logs.txt
      - name: Encerrar
        if: always()
        run: docker compose -f labs/local/compose.yaml down
